<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Restaurant Name</title>
    <link href="/css/styles.css" rel="stylesheet">
    <script defer src="/js/main.js"></script>
    <script defer src="/js/contact-form.js"></script>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="/" class="logo">Restaurant Name</a>
            <ul class="nav-links">
                <li><a href="/about">About</a></li>
                <li><a href="/menu">Menu</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-main">
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Fill out the form below or visit us at our location.</p>
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </section>
        <section class="location-section">
            <h2>Visit Us</h2>
            <address>
                1234 Elm Street<br>
                Springfield, IL 62701<br>
                Phone: (555) 123-4567
            </address>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2023 Restaurant Name. All rights reserved.</p>
    </footer>
</body>
</html>
